name: Bug report
description: Something is broken or does not behave as expected.
title: 'fix: '
labels: ['kind: bug', 'status: needs info']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Before opening a new issue, please search the
        [existing issues](https://github.com/Iamliuxiaozhen/tauri-3080/issues?q=is%3Aissue)
        — duplicates cost maintainers time.

        For a security problem, **do not open a public issue**; follow
        [SECURITY.md](https://github.com/Iamliuxiaozhen/tauri-3080/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: tauri-3080 version
      description: Shown in Settings → About, or in the release you downloaded.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Ubuntu 24.04, macOS 15.2, Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour, including any error text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smaller the reproduction, the faster the fix.
      placeholder: |
        1. Create a profile named "Dev" with url http://127.0.0.1:4000
        2. Set the hook mode to "wait-for-port"
        3. Start the app
        4. ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: |
        The profile from `config.toml` and, if the bug involves hooks, the
        script itself. **Redact tokens and personal paths.**
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Hook output lives in `logs/prelaunch-<profile>.log` inside the
        configuration directory. For a crash, include the terminal output when
        started from a terminal.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I am using the latest release.
          required: true
