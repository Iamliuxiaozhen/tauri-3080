version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    # typescript-eslint still caps TypeScript at <6.1, so a TypeScript 7 bump
    # cannot pass the PR gate. Revisit when the peer range widens.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      frontend-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      rust-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels: ['dependencies', 'area: ci']
