name: PR title

# Pull request titles become the squash-merge commit message, so they are
# linted against Conventional Commits. The job name is `lint-pr-title` and is
# part of the required checks.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Lint the pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md → Commit messages.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            launcher
            settings
            config
            hooks
            windows
            menus
            tray
            icons
            i18n
            ci
            release
            deps
            docs
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must not start with an uppercase letter.

            Example: feat(hooks): wait for the port before navigating
          wip: true
          # `dependabot[bot]` titles ("chore(deps): bump …") already conform.
          ignoreLabels: |
            dependencies
