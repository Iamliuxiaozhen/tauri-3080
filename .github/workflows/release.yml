name: Release

# Builds installers for Linux, macOS and Windows and attaches them to a GitHub
# release. The release is always created as a DRAFT: a maintainer reviews the
# notes and artifacts and publishes it by hand.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for example v0.1.0). Must already exist.'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft.'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '22'

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "::error::no tag to build"
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a semantic version tag (vX.Y.Z)"
            exit 1
          fi

          version="${tag#v}"
          # A tag with a suffix (v1.0.0-rc.1) is a pre-release.
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          # Manual runs can ask for a published release; tag pushes always draft.
          draft="true"
          if [ "${INPUT_DRAFT:-}" = "false" ] && [ -n "${INPUT_TAG:-}" ]; then
            draft="false"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "building $tag (version $version, draft=$draft, prerelease=$prerelease)"

      - name: Verify the versions agree
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "package.json=$pkg Cargo.toml=$cargo tauri.conf.json=$conf tag=$VERSION"
          for candidate in "$pkg" "$cargo" "$conf"; do
            if [ "$candidate" != "$VERSION" ]; then
              echo "::error::version mismatch: $candidate != $VERSION"
              exit 1
            fi
          done

  build:
    name: Build (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            target: ''
            args: ''
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - label: windows-x86_64
            os: windows-2025
            target: ''
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.label }}

      - name: Build and attach the bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'tauri-3080 ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ github.event.repository.description }}
          releaseDraft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          uploadPlainBinary: false
          retryAttempts: 2

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify the release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Report the release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,url,assets \
            --template '# {{ .tagName }} (draft={{ .isDraft }})\n{{ .url }}\n{{ range .assets }}- {{ .name }} ({{ .size }} bytes)\n{{ end }}'
          echo
          if [ "$DRAFT" = "true" ]; then
            cat <<'EOF'
          ============================================================
          The release was created as a DRAFT.

          Review the generated notes and the artifacts, then publish it:
            gh release edit <tag> --draft=false
          ============================================================
          EOF
          fi

      - name: Download the release assets
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: List the downloadable assets
        run: |
          find release-assets -type f -printf '%p (%s bytes)\n' || find release-assets -type f
